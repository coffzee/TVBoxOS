name: FongMi 4.0.7 build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      # 阶段 A：构建 FongMi/media fork（含 setRender/setBottomPosition/AUDIO_AV3A 定制）
      # 只发布 lib-common + lib-ui 到 mavenLocal，版本 1.11.0 与官方 mavenCentral 坐标一致
      - name: Build FongMi/media fork into mavenLocal
        run: |
          git clone --depth 1 -b release-1.11.0-fongmi https://github.com/FongMi/media.git media
          cd media
          chmod +x gradlew
          # androidx 发布脚本白名单缺 org.brotli:dec，补进 JAR 列表
          sed -i 's/"org\.chromium\.net:cronet-api",/"org.chromium.net:cronet-api",\n      "org.brotli:dec",/' build-logic/src/main/kotlin/androidx/media3/buildlogic/aarTypeWorkaround.kt
          grep -n "brotli" build-logic/src/main/kotlin/androidx/media3/buildlogic/aarTypeWorkaround.kt
          ./gradlew :lib-common:publishToMavenLocal :lib-ui:publishToMavenLocal :lib-ui-danmaku:publishToMavenLocal --no-daemon
          echo "--- mavenLocal artifacts ---"
          find ~/.m2/repository/androidx/media3 -name "*.aar" -o -name "*.jar" | head

      # 阶段 B：FongMi/TV 4.0.7（minSdk 21 早期提交）
      - name: Checkout FongMi/TV at 4.0.7
        run: |
          git init fongmi
          cd fongmi
          git remote add origin https://github.com/FongMi/TV.git
          git fetch --depth 1 origin 6f0d2b5a08e0f324502d480e3b0f83232b9c3947
          git checkout FETCH_HEAD

      - name: Restore private-era AARs (danmaku + dlna)
        run: |
          base=https://raw.githubusercontent.com/liujianpc/PhoneMeTv/develop/app/libs
          for f in danmaku.aar dlna-core-release.aar dlna-dmc-release.aar dlna-dmr-release.aar; do
            curl -sSL --retry 3 -o fongmi/app/libs/$f $base/$f
            ls -la fongmi/app/libs/$f
          done

      - name: Patch build files
        working-directory: fongmi
        run: |
          # settings.gradle：mavenLocal 优先 + 补上模块 include（私有时代这些模块未入 settings）
          sed -i 's/^    repositories {$/    repositories {\n        mavenLocal()/' settings.gradle
          sed -i "s/include ':quickjs'/include ':quickjs'\ninclude ':forcetech'\ninclude ':hook'\ninclude ':jianpian'\ninclude ':thunder'\ninclude ':tvbus'/" settings.gradle

          # media3 依赖直接用 1.11.0（fork 的 common/ui 来自 mavenLocal，其余走 mavenCentral）
          python3 - <<'EOF'
          a = open('app/build.gradle').read()
          old = 'implementation fileTree(dir: "libs", include: ["*.aar"])'
          new = ('implementation fileTree(dir: "libs", include: ["*.aar"])\n'
                 '    implementation project(":forcetech")\n'
                 '    implementation project(":hook")\n'
                 '    implementation project(":jianpian")\n'
                 '    implementation project(":thunder")\n'
                 '    implementation project(":tvbus")\n'
                 '    implementation "androidx.media3:media3-common:1.11.0"\n'
                 '    implementation "androidx.media3:media3-exoplayer:1.11.0"\n'
                 '    implementation "androidx.media3:media3-ui:1.11.0"\n'
                 '    implementation "androidx.media3:media3-database:1.11.0"\n'
                 '    implementation "androidx.media3:media3-datasource-okhttp:1.11.0"\n'
                 '    implementation "androidx.media3:media3-datasource-rtmp:1.11.0"\n'
                 '    implementation "androidx.media3:media3-exoplayer-dash:1.11.0"\n'
                 '    implementation "androidx.media3:media3-exoplayer-hls:1.11.0"\n'
                 '    implementation "androidx.media3:media3-exoplayer-rtsp:1.11.0"\n'
                 '    implementation "androidx.media3:media3-exoplayer-smoothstreaming:1.11.0"\n'
                 '    implementation("com.github.anilbeesetti.nextlib:nextlib-media3ext:0.8.2") { exclude group: "androidx.media3", module: "media3-exoplayer" }')
          assert old in a
          a = a.replace(old, new)
          open('app/build.gradle','w').write(a)
          print('patched')
          EOF

          # 补丁 1：删掉私有 media3 才有的 MediaItem.Builder.setAds / setDecode（无消费方）
          sed -i '/builder\.setAds(Sniffer\.getRegex(uri));/d' app/src/main/java/com/fongmi/android/tv/player/exo/ExoUtil.java
          sed -i '/builder\.setDecode(decode);/d' app/src/main/java/com/fongmi/android/tv/player/exo/ExoUtil.java

          # 补丁 2：fork MimeTypes 只有 APPLICATION_OCTET_STREAM，无 APPLICATION_OCTET
          sed -i 's/MimeTypes\.APPLICATION_OCTET;/MimeTypes.APPLICATION_OCTET_STREAM;/' app/src/main/java/com/fongmi/android/tv/player/exo/ExoUtil.java

          # 补丁 3：公开版 nextlib 没有 setAudioPrefer/setVideoPrefer（私有 AAR 定制）
          sed -i 's/\.setAudioPrefer(Setting\.isAudioPrefer())//; s/\.setVideoPrefer(Setting\.isVideoPrefer())//' app/src/main/java/com/fongmi/android/tv/player/exo/ExoUtil.java

          # 补丁 4：fork media3 minSdk 23，与 app minSdk 21 冲突 → 提到 23（目标电视 API 23）
          sed -i 's/minSdk 21/minSdk 23/' app/build.gradle

          # chaquo: pin 兼容 Python 3.8 的版本
          sed -i 's/^pyquery$/pyquery==2.0.1/' chaquo/requirements.txt
          grep -q cssselect chaquo/requirements.txt || echo cssselect==1.2.0 >> chaquo/requirements.txt
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          grep -n "mavenLocal\|media3\|minSdk" settings.gradle app/build.gradle
          grep -n "setAds\|setDecode\|AUDIO\|OCTET\|RenderersFactory()" app/src/main/java/com/fongmi/android/tv/player/exo/ExoUtil.java

      - name: Build leanback armeabi_v7a debug APK
        working-directory: fongmi
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleLeanbackArmeabi_v7aDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-407-leanback-arm32
          path: fongmi/app/build/outputs/apk/leanbackArmeabi_v7a/debug/*.apk
