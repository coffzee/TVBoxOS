name: FongMi 4.0.7 build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Checkout FongMi/TV at 4.0.7 (minSdk 21)
        run: |
          git init fongmi
          cd fongmi
          git remote add origin https://github.com/FongMi/TV.git
          git fetch --depth 1 origin 6f0d2b5a08e0f324502d480e3b0f83232b9c3947
          git checkout FETCH_HEAD

      - name: Restore private-era AARs (danmaku + dlna)
        run: |
          base=https://raw.githubusercontent.com/liujianpc/PhoneMeTv/develop/app/libs
          for f in danmaku.aar dlna-core-release.aar dlna-dmc-release.aar dlna-dmr-release.aar; do
            curl -sSL --retry 3 -o fongmi/app/libs/$f $base/$f
            ls -la fongmi/app/libs/$f
          done

      - name: Patch build files
        working-directory: fongmi
        run: |
          python3 - <<'EOF'
          s = open('settings.gradle').read()
          s = s.replace("include ':quickjs'",
                        "include ':quickjs'\ninclude ':forcetech'\ninclude ':hook'\ninclude ':jianpian'\ninclude ':thunder'\ninclude ':tvbus'")
          open('settings.gradle','w').write(s)

          a = open('app/build.gradle').read()
          old = 'implementation fileTree(dir: "libs", include: ["*.aar"])'
          new = ('implementation fileTree(dir: "libs", include: ["*.aar"])\n'
                 '    implementation project(":forcetech")\n'
                 '    implementation project(":hook")\n'
                 '    implementation project(":jianpian")\n'
                 '    implementation project(":thunder")\n'
                 '    implementation project(":tvbus")\n'
                 '    implementation "androidx.media3:media3-common:1.8.0"\n'
                 '    implementation "androidx.media3:media3-exoplayer:1.8.0"\n'
                 '    implementation "androidx.media3:media3-ui:1.8.0"\n'
                 '    implementation "androidx.media3:media3-database:1.8.0"\n'
                 '    implementation "androidx.media3:media3-datasource-okhttp:1.8.0"\n'
                 '    implementation "androidx.media3:media3-datasource-rtmp:1.8.0"\n'
                 '    implementation "androidx.media3:media3-exoplayer-dash:1.8.0"\n'
                 '    implementation "androidx.media3:media3-exoplayer-hls:1.8.0"\n'
                 '    implementation "androidx.media3:media3-exoplayer-rtsp:1.8.0"\n'
                 '    implementation "androidx.media3:media3-exoplayer-smoothstreaming:1.8.0"\n'
                 '    implementation("com.github.anilbeesetti.nextlib:nextlib-media3ext:0.8.2") { exclude group: "androidx.media3", module: "media3-exoplayer" }')
          assert old in a
          a = a.replace(old, new)
          open('app/build.gradle','w').write(a)
          print('patched')
          EOF

          # chaquo: pin 兼容 Python 3.8 的版本
          sed -i 's/^pyquery$/pyquery==2.0.1/' chaquo/requirements.txt
          grep -q cssselect chaquo/requirements.txt || echo cssselect==1.2.0 >> chaquo/requirements.txt
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          git diff --stat

      - uses: gradle/actions/setup-gradle@v4

      - name: Build leanback armeabi_v7a debug APK
        working-directory: fongmi
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleLeanbackArmeabi_v7aDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-407-leanback-arm32
          path: fongmi/app/build/outputs/apk/leanbackArmeabi_v7a/debug/*.apk
