name: FongMi 4.0.7 build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Checkout FongMi/TV at 4.0.7 (minSdk 21)
        run: |
          git init fongmi
          cd fongmi
          git remote add origin https://github.com/FongMi/TV.git
          git fetch --depth 1 origin 6f0d2b5a08e0f324502d480e3b0f83232b9c3947
          git checkout FETCH_HEAD

      - name: Checkout DanmakuFlameMaster v0.9.25
        run: |
          git clone --depth 1 --branch v0.9.25 https://github.com/Bilibili/DanmakuFlameMaster.git dfm
          mkdir -p fongmi/danmaku/src/main
          cp -r dfm/DanmakuFlameMaster/src/main/java fongmi/danmaku/src/main/java
          cp -r dfm/DanmakuFlameMaster/src/main/res fongmi/danmaku/src/main/res 2>/dev/null || true
          rm -rf dfm

      - name: Patch build files
        working-directory: fongmi
        run: |
          python3 - <<'EOF'
          # settings.gradle: 增加库模块
          s = open('settings.gradle').read()
          s = s.replace("include ':quickjs'",
                        "include ':quickjs'\ninclude ':forcetech'\ninclude ':hook'\ninclude ':jianpian'\ninclude ':thunder'\ninclude ':tvbus'\ninclude ':danmaku'")
          open('settings.gradle','w').write(s)

          # app/build.gradle: fileTree AAR 换成工程依赖，弹幕库走工程模块
          a = open('app/build.gradle').read()
          a = a.replace('implementation fileTree(dir: "libs", include: ["*.aar"])',
                        'implementation project(":forcetech")\n    implementation project(":hook")\n    implementation project(":jianpian")\n    implementation project(":thunder")\n    implementation project(":tvbus")\n    implementation project(":danmaku")\n    implementation "androidx.media3:media3-common:1.8.0"\n    implementation "androidx.media3:media3-exoplayer:1.8.0"\n    implementation "androidx.media3:media3-ui:1.8.0"\n    implementation "androidx.media3:media3-database:1.8.0"\n    implementation "androidx.media3:media3-datasource-okhttp:1.8.0"\n    implementation "androidx.media3:media3-exoplayer-dash:1.8.0"\n    implementation "androidx.media3:media3-exoplayer-hls:1.8.0"\n    implementation "androidx.media3:media3-exoplayer-rtsp:1.8.0"')
          open('app/build.gradle','w').write(a)
          print('patched')
          EOF

          # danmaku 模块：AGP8 兼容配置
          cat > danmaku/build.gradle <<'G'
          plugins { id 'com.android.library' }
          android {
              namespace 'master.flame.danmaku'
              compileSdk 34
              defaultConfig { minSdk 21 }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          G
          cat > danmaku/src/main/AndroidManifest.xml <<'X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest />
          X
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          git diff --stat

      - uses: gradle/actions/setup-gradle@v4

      - name: Build leanback armeabi_v7a debug APK
        working-directory: fongmi
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleLeanbackArmeabi_v7aDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-407-leanback-arm32
          path: fongmi/app/build/outputs/apk/leanbackArmeabi_v7a/debug/*.apk
